plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = mod_version
group = 'ru.wik.colonyboard'
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
}
repositories { flatDir { dir 'libs' }; mavenCentral() }
dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.28"
    compileOnly fg.deobf("blank:minecolonies:1.1.1237")
    compileOnly fg.deobf("blank:structurize:1.0.816")
    compileOnly fg.deobf("blank:blockui:1.0.193")
    compileOnly fg.deobf("blank:domum:1.0.301")
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar {
    manifest { attributes(['Specification-Title': mod_id, 'Implementation-Version': project.version, 'MixinConfigs': 'colonyboard.mixins.json']) }
    finalizedBy 'reobfJar'
}
test { useJUnitPlatform() }
dependencies { testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
dependencies {
    compileOnly fg.deobf("blank:colonybuy:1.0.3")
    compileOnly fg.deobf("blank:warntax:5.0.9")
    compileOnly fg.deobf("blank:SDMEconomy:1.20.1-forge-2.2.0")
}
