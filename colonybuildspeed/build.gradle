plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = mod_version
group = 'ru.wik.colonybuildspeed'
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
}
repositories { flatDir { dir '../colonyboard/libs' } }
dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.28"
    compileOnly fg.deobf("blank:minecolonies:1.1.1237")
    compileOnly fg.deobf("blank:structurize:1.0.816")
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Implementation-Version': project.version,
            'MixinConfigs': 'colonybuildspeed.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}
test { useJUnitPlatform() }
